<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>The Two Pennies — Live Scores</title>
  <style>
    @font-face{font-family:"TwoPenniesPlain";src:url("./assets/Twopenniesplain-Regular.ttf") format("truetype");font-display:swap}
    :root{--fg:#f3f3f3;--muted:rgba(243,243,243,.78);--card:rgba(0,0,0,.55);--stroke:rgba(255,255,255,.12);--rowbg:rgba(0,0,0,.28);--rowstroke:rgba(255,255,255,.10)}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    body{color:var(--fg);font-family:TwoPenniesPlain,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-transform:uppercase}
    .stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:top left;background:#0b0b0b}
    .bg{position:absolute;inset:0;z-index:0;background-position:center;background-size:cover;background-repeat:no-repeat}
    body[data-mode="welcome"] .bg{background-image:url("./assets/Generic.png")}
    body[data-mode="live"] .bg{background-image:url("./assets/Live.png")}
    .content{position:relative;z-index:20;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;padding:60px 80px}
    body[data-mode="welcome"] .boards{display:none}
    body[data-mode="live"] .boards{display:flex}
    .boards{width:1500px;max-height:850px;flex-direction:column;align-items:stretch;justify-content:center;gap:18px}
    .scoresCard{width:100%;max-height:665px;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:20px 26px 22px;border:1px solid var(--stroke);border-radius:26px;background:var(--card);box-shadow:0 16px 40px rgba(0,0,0,.38)}
    .boards.multi .scoresCard{max-height:405px;padding:14px 22px 16px;gap:8px}
    .competitionHeader{min-height:52px;display:flex;align-items:center;justify-content:center;gap:17px;padding:0 16px 3px;font-size:32px;line-height:1;letter-spacing:.5px;text-align:center}
    .competitionHeader img{width:64px;height:58px;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(0,0,0,.35))}
    .boards.multi .competitionHeader{min-height:40px;font-size:25px;gap:12px;padding-bottom:0}
    .boards.multi .competitionHeader img{width:50px;height:42px}
    .rows{display:flex;flex-direction:column;gap:12px;overflow:hidden}
    .boards.multi .rows{gap:8px}
    .row{position:relative;display:grid;grid-template-columns:1fr auto 1fr;column-gap:18px;align-items:baseline;padding:12px 22px;border:1px solid var(--rowstroke);border-radius:18px;background:var(--rowbg)}
    .boards.multi .row{padding:8px 18px;border-radius:15px}
    .row.highlight{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.75)}
    .team{align-self:baseline;overflow:hidden;font-size:30px;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
    .team.home{grid-column:1;padding-right:6px;text-align:right}.team.away{grid-column:3;padding-left:6px;text-align:left}
    .boards.multi .team{font-size:24px}
    .scoreLine{grid-column:2;display:flex;flex-direction:column;align-items:center}
    .scoreTop{display:grid;grid-template-columns:54px 54px 54px;align-items:baseline;justify-items:center;line-height:1}
    .score{min-width:24px;display:inline-block;font-size:52px;font-weight:700;line-height:.9;text-align:center;font-variant-numeric:tabular-nums}
    .vs{font-size:24px;font-weight:500;line-height:1;letter-spacing:.5px;opacity:.92}
    .status{width:162px;margin-top:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums}
    .boards.multi .scoreTop{grid-template-columns:46px 46px 46px}.boards.multi .score{font-size:41px}.boards.multi .vs{font-size:20px}.boards.multi .status{width:138px;margin-top:3px;font-size:17px}
    .pageDots{min-height:10px;display:flex;justify-content:center;gap:7px}.pageDots:empty{display:none}.pageDot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}.pageDot.active{background:#fff}
    #statusDot{position:fixed;top:6px;left:6px;z-index:1000000;width:12px;height:12px;border-radius:50%;background:transparent;pointer-events:none}
    .debug{position:fixed;top:90px;left:24px;z-index:999999;display:none;min-width:190px;gap:10px;flex-direction:column;padding:10px;border:1px solid rgba(255,255,255,.22);border-radius:14px;background:rgba(0,0,0,.72);font:14px system-ui,sans-serif;text-transform:none;backdrop-filter:blur(6px)}
    .debugRow{display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
  </style>
</head>
<body data-mode="welcome">
  <div class="stage" id="stage">
    <div class="bg" aria-hidden="true"></div><div id="statusDot" aria-hidden="true"></div>
    <div class="debug" id="debugPanel" aria-label="Debug information">
      <div class="debugRow"><span>Mode</span><span id="dbgMode">—</span></div><div class="debugRow"><span>Last poll</span><span id="dbgLastPoll">—</span></div>
      <div class="debugRow"><span>Next poll</span><span id="dbgNextPoll">—</span></div><div class="debugRow"><span>Boards</span><span id="dbgBoards">—</span></div>
      <div class="debugRow"><span>Source</span><span id="dbgSource">—</span></div><div class="debugRow"><span>Error</span><span id="dbgErr">—</span></div>
    </div>
    <main class="content"><section class="boards" id="boards" aria-label="Live football scores"></section></main>
  </div>
  <script>
    const DESIGN_WIDTH=1920,DESIGN_HEIGHT=1080;
    const params=new URLSearchParams(location.search),forcedMode=(params.get("mode")||"").toLowerCase(),preview=(params.get("preview")||"").toLowerCase(),DEBUG=params.get("debug")==="1";
    const legacyHighlightIds=(params.get("highlight")||"").split(",").map(Number).filter(Number.isFinite);
    const stage=document.getElementById("stage"),boardsElement=document.getElementById("boards"),statusDot=document.getElementById("statusDot"),debugPanel=document.getElementById("debugPanel");
    const dbgMode=document.getElementById("dbgMode"),dbgLastPoll=document.getElementById("dbgLastPoll"),dbgNextPoll=document.getElementById("dbgNextPoll"),dbgBoards=document.getElementById("dbgBoards"),dbgSource=document.getElementById("dbgSource"),dbgErr=document.getElementById("dbgErr");
    let pageTimers=[];
    function fitStage(){const scale=Math.min(innerWidth/DESIGN_WIDTH,innerHeight/DESIGN_HEIGHT);stage.style.left=`${(innerWidth-DESIGN_WIDTH*scale)/2}px`;stage.style.top=`${(innerHeight-DESIGN_HEIGHT*scale)/2}px`;stage.style.transform=`scale(${scale})`}
    fitStage();addEventListener("resize",fitStage);debugPanel.style.display=DEBUG?"flex":"none";
    function setMode(mode){document.body.dataset.mode=mode;if(DEBUG)dbgMode.textContent=mode.toUpperCase()}
    function setDot(state){statusDot.style.background=state==="good"?"#18c46c":state==="warn"?"#f2b01e":state==="bad"?"#e53935":"transparent"}
    function parseUtc(value){const date=new Date(value);return Number.isFinite(date.getTime())?date:null}
    function isLiveStatus(value){return["IN_PLAY","PAUSED","LIVE"].includes(String(value||"").toUpperCase())}
    function scoresFor(match){const full=match.score?.fullTime||{},half=match.score?.halfTime||{};return{home:full.home??half.home??null,away:full.away??half.away??null}}
    function kickOffLabel(date){return new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",hour:"2-digit",minute:"2-digit"}).format(date)}
    function statusLabel(match){const status=String(match.status||"").toUpperCase();if(status==="PAUSED")return"HT";if(isLiveStatus(status)){const minute=Number(match.minute),injury=Number(match.injuryTime);if(Number.isFinite(minute)&&minute>0)return Number.isFinite(injury)&&injury>0?`${minute}+${injury}'`:`${minute}'`;return"LIVE"}if(status==="FINISHED")return match.score?.duration==="PENALTY_SHOOTOUT"?"PEN":"FT";if(status==="POSTPONED")return"POSTPONED";if(status==="CANCELLED")return"CANCELLED";const kick=match.__kick||parseUtc(match.utcDate);return kick?kickOffLabel(kick):"KO"}
    function normaliseName(value){return String(value||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
    function isHighlighted(match,settings){if(legacyHighlightIds.includes(Number(match.homeTeam?.id))||legacyHighlightIds.includes(Number(match.awayTeam?.id)))return true;const home=normaliseName(match.homeTeam?.name),away=normaliseName(match.awayTeam?.name);return(settings.highlightTeams||[]).some(name=>{const wanted=normaliseName(name);return wanted&&(home===wanted||away===wanted)})}
    function annotateAndSort(matches,settings){const priority=new Map((settings.competitions||[]).map((id,index)=>[id,index]));return(matches||[]).filter(match=>match?.homeTeam&&match?.awayTeam).map(match=>{const kick=parseUtc(match.utcDate)||new Date(0),live=isLiveStatus(match.status),highlighted=isHighlighted(match,settings);return{...match,__kick:kick,__live:live,__highlighted:highlighted,__pin:live&&highlighted}}).sort((a,b)=>{if(a.__pin!==b.__pin)return a.__pin?-1:1;if(a.__live!==b.__live)return a.__live?-1:1;const comp=(priority.get(a.comp)??999)-(priority.get(b.comp)??999);return comp||a.__kick-b.__kick})}
    function decideMode(sorted,now,settings){if(forcedMode==="live"||forcedMode==="welcome")return forcedMode;if(sorted.some(match=>isLiveStatus(match.status)))return"live";if(sorted.some(match=>{const status=String(match.status||"").toUpperCase(),minutes=(match.__kick-now)/60000;return["SCHEDULED","TIMED"].includes(status)&&minutes>=0&&minutes<=settings.preMinutes}))return"live";return sorted.some(match=>{if(String(match.status||"").toUpperCase()!=="FINISHED")return false;const minutesAfter=(now.getTime()-(match.__kick.getTime()+105*60000))/60000;return minutesAfter>=0&&minutesAfter<=settings.postMinutes})?"live":"welcome"}
    function filterForDisplay(sorted,now,mode,settings){let display=sorted.filter(match=>{const status=String(match.status||"").toUpperCase();if(isLiveStatus(status))return true;if(["SCHEDULED","TIMED"].includes(status)){const minutes=(match.__kick-now)/60000;return minutes>=0&&minutes<=settings.preMinutes}if(status==="FINISHED"){const minutesAfter=(now.getTime()-(match.__kick.getTime()+105*60000))/60000;return minutesAfter>=0&&minutesAfter<=settings.postMinutes}return false});if(mode==="live"&&!display.length)display=sorted.filter(match=>["SCHEDULED","TIMED"].includes(String(match.status||"").toUpperCase())).slice(0,settings.maxRows);return display}
    function groupMatches(matches,settings){const groups=new Map;for(const match of matches){if(!groups.has(match.comp))groups.set(match.comp,[]);groups.get(match.comp).push(match)}const order=new Map((settings.competitions||[]).map((id,index)=>[id,index]));return[...groups.entries()].map(([id,items])=>({id,competition:items[0].competition||{id,code:id,shortName:id,name:id,logo:null},matches:items})).sort((a,b)=>{const al=a.matches.some(match=>match.__live),bl=b.matches.some(match=>match.__live);if(al!==bl)return al?-1:1;const ah=a.matches.some(match=>match.__highlighted),bh=b.matches.some(match=>match.__highlighted);if(ah!==bh)return ah?-1:1;return(order.get(a.id)??999)-(order.get(b.id)??999)}).slice(0,settings.maxBoards)}
    function rowElement(match){const score=scoresFor(match),row=document.createElement("div");row.className=`row${match.__highlighted?" highlight":""}`;row.innerHTML='<div class="team home"></div><div class="scoreLine"><div class="scoreTop"><span class="score scoreHome"></span><span class="vs">vs</span><span class="score scoreAway"></span></div><div class="status"></div></div><div class="team away"></div>';row.querySelector(".team.home").textContent=match.homeTeam?.name||"";row.querySelector(".team.away").textContent=match.awayTeam?.name||"";row.querySelector(".scoreHome").textContent=score.home??"";row.querySelector(".scoreAway").textContent=score.away??"";row.querySelector(".status").textContent=statusLabel(match);return row}
    function boardPages(matches,pageSize){if(matches.length<=pageSize)return[matches];const pinned=matches.find(match=>match.__pin)||null,rest=pinned?matches.filter(match=>match!==pinned):matches,size=Math.max(1,pageSize-(pinned?1:0)),pages=[];for(let index=0;index<rest.length;index+=size)pages.push([...(pinned?[pinned]:[]),...rest.slice(index,index+size)]);return pages}
    function renderBoards(groups,settings){pageTimers.forEach(clearInterval);pageTimers=[];boardsElement.innerHTML="";boardsElement.classList.toggle("multi",groups.length>1);const pageSize=groups.length>1?Math.min(3,settings.maxRows):settings.maxRows;for(const group of groups){const card=document.createElement("article"),header=document.createElement("header"),rows=document.createElement("div"),dots=document.createElement("div");card.className="scoresCard";header.className="competitionHeader";rows.className="rows";dots.className="pageDots";if(settings.showCompetitionLogo&&group.competition.logo){const logo=document.createElement("img");logo.src=group.competition.logo;logo.alt="";header.appendChild(logo)}const title=document.createElement("span");title.textContent=group.competition.shortName||group.competition.name;header.appendChild(title);card.append(header,rows,dots);boardsElement.appendChild(card);const pages=boardPages(group.matches,pageSize);if(pages.length>1)pages.forEach((_,index)=>{const dot=document.createElement("span");dot.className=`pageDot${index===0?" active":""}`;dots.appendChild(dot)});let page=0;const draw=()=>{rows.replaceChildren(...pages[page].map(rowElement));[...dots.children].forEach((dot,index)=>dot.classList.toggle("active",index===page))};draw();if(pages.length>1)pageTimers.push(setInterval(()=>{page=(page+1)%pages.length;draw()},7000))}if(DEBUG)dbgBoards.textContent=String(groups.length)}
    function sampleData(twoBoards){const now=new Date(),competition=(id,code,shortName,logo)=>({id,code,name:shortName,shortName,logo}),match=(id,comp,meta,home,away,hs,as,minute)=>({id,comp,competition:meta,status:"IN_PLAY",utcDate:new Date(now-60*60000).toISOString(),minute,homeTeam:{id:`${id}-h`,name:home},awayTeam:{id:`${id}-a`,name:away},score:{fullTime:{home:hs,away:as}}}),pl=competition("pl","PL","Premier League","/assets/competitions/premier-league.png"),cup=competition("league-cup","LC","Carabao Cup","/assets/competitions/league-cup.png"),matches=[match("sample-1","pl",pl,"Newcastle","Liverpool",2,1,67),match("sample-2","pl",pl,"Everton","Brighton",0,0,64),match("sample-3","pl",pl,"West Ham","Wolves",1,2,71)];if(twoBoards)matches.push(match("sample-4","league-cup",cup,"Arsenal","Chelsea",1,1,58),match("sample-5","league-cup",cup,"Sunderland","Leeds",0,2,61));return{ok:true,settings:{sourceMode:"espn",competitions:["pl","league-cup"],maxRows:5,preMinutes:60,postMinutes:120,maxBoards:2,showCompetitionLogo:true,highlightTeams:["Newcastle","England"]},matches}}
    async function fetchFeed(){if(preview==="welcome")return{...sampleData(false),matches:[],forcedWelcome:true};if(preview==="one")return sampleData(false);if(preview==="two")return sampleData(true);const query=new URLSearchParams;for(const key of["comps","max","pre","post","source"])if(params.has(key))query.set(key,params.get(key));const result=await fetch(`/api/scores${query.size?`?${query}`:""}`,{cache:"no-store"}),data=await result.json().catch(()=>null);if(!result.ok||!data?.ok)throw new Error(data?.error||`Scores request failed (${result.status})`);return data}
    function nextPollDelay(sorted,now){if(sorted.some(match=>match.__live))return 30000;let soonest=Infinity;for(const match of sorted){const status=String(match.status||"").toUpperCase();if(!["TIMED","SCHEDULED"].includes(status))continue;soonest=Math.min(soonest,match.__kick-now)}if(soonest>=0&&soonest<=3*60*60*1000)return 60000;if(soonest>=0&&soonest<=24*60*60*1000)return 5*60000;return 10*60000}
    async function tick(){try{setDot("warn");dbgErr.textContent="—";const now=new Date;if(DEBUG)dbgLastPoll.textContent=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(now);const data=await fetchFeed(),settings=data.settings,sorted=annotateAndSort(data.matches,settings),mode=data.forcedWelcome?"welcome":decideMode(sorted,now,settings),display=filterForDisplay(sorted,now,mode,settings),groups=groupMatches(display,settings);setMode(mode);renderBoards(groups,settings);if(DEBUG)dbgSource.textContent=settings.sourceMode;setDot("good");if(preview)return;const delay=nextPollDelay(sorted,now);if(DEBUG)dbgNextPoll.textContent=`${Math.round(delay/1000)}s`;setTimeout(tick,delay)}catch(error){setMode("welcome");renderBoards([],{maxRows:5});setDot("bad");if(DEBUG)dbgErr.textContent=error?.message||String(error);setTimeout(tick,60000)}}
    setDot("clear");setTimeout(tick,200);
  </script>
</body>
</html>
