<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>The Two Pennies — Live Scores</title>
  <style>
    @font-face{font-family:"TwoPenniesPlain";src:url("./assets/Twopenniesplain-Regular.ttf") format("truetype");font-display:swap}
    :root{--fg:#f3f3f3;--muted:rgba(243,243,243,.78);--card:rgba(0,0,0,.55);--stroke:rgba(255,255,255,.12);--rowbg:rgba(0,0,0,.28);--rowstroke:rgba(255,255,255,.10)}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    body{color:var(--fg);font-family:TwoPenniesPlain,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-transform:uppercase}
    .stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:top left;background:#0b0b0b}
    .bg{position:absolute;inset:0;z-index:0;background-position:center;background-size:cover;background-repeat:no-repeat}
    body[data-mode="welcome"] .bg{background-image:url("./assets/Generic.webp")}
    body[data-mode="live"] .bg{background-image:url("./assets/Live.webp")}
    .content{position:relative;z-index:20;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;padding:60px 80px}
    body[data-mode="welcome"] .boards{display:none}

    .boards{width:1500px;max-height:850px;flex-direction:column;align-items:stretch;justify-content:center;gap:18px}
    .scoresCard{width:100%;max-height:665px;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:20px 26px 22px;border:1px solid var(--stroke);border-radius:26px;background:var(--card);box-shadow:0 16px 40px rgba(0,0,0,.38)}

    .competitionHeader{min-height:52px;display:flex;align-items:center;justify-content:center;gap:17px;padding:0 16px 3px;font-size:32px;line-height:1;letter-spacing:.5px;text-align:center}
    .competitionHeader img{width:64px;height:58px;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(0,0,0,.35))}
    .boards.multi .competitionHeader{min-height:40px;font-size:25px;gap:12px;padding-bottom:0}
    .boards.multi .competitionHeader img{width:50px;height:42px}
    .rows,.scrollSequence,.scrollTrack{display:flex;flex-direction:column;gap:12px}.rows,.scrollViewport{overflow:hidden}.scrollViewport{flex:none}.scrollTrack{will-change:transform}.scrollTrack.scrolling{animation:scoreRowsLoop var(--scroll-duration) linear infinite;animation-delay:var(--scroll-delay)}
    .boards.multi .rows{gap:8px}
    .boards.multi .scrollSequence,.boards.multi .scrollTrack{gap:8px}

    .boards.multi .row{min-height:78px;padding:6px 18px;border-radius:15px}
    .row.highlight{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.75)}
    .teamPanel{min-width:0;display:grid;grid-template-rows:17px auto 18px;gap:3px;align-items:center}.teamPanel.home{grid-column:1;justify-items:end;padding-right:6px;text-align:right}.teamPanel.away{grid-column:3;justify-items:start;padding-left:6px;text-align:left}
    .team{max-width:100%;overflow:hidden;font-size:30px;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
    .boards.multi .team{font-size:24px}

    .goalIcon{font-size:14px;line-height:1;filter:grayscale(1)}.redCardIcon{display:inline-block;width:9px;height:13px;border:1px solid rgba(255,255,255,.42);border-radius:1px;background:#df1f2d;box-shadow:0 1px 2px rgba(0,0,0,.5)}
    .boards.multi .incident{font-size:11px}.boards.multi .incidentList{gap:7px}.boards.multi .incidentItem{gap:4px}.boards.multi .goalIcon{font-size:11px}.boards.multi .redCardIcon{width:7px;height:10px}
    .scoreLine{position:relative;grid-column:2;align-self:stretch;display:flex;align-items:center;justify-content:center}
    .scoreTop{display:grid;grid-template-columns:54px 54px 54px;align-items:baseline;justify-items:center;line-height:1}
    .score{min-width:24px;display:inline-block;font-size:52px;font-weight:700;line-height:.9;text-align:center;font-variant-numeric:tabular-nums}
    .vs{font-size:24px;font-weight:500;line-height:1;letter-spacing:.5px;opacity:.92}
    .status{position:absolute;top:calc(50% + 24px);width:162px;display:flex;align-items:baseline;justify-content:center;gap:7px;color:var(--muted);font-size:20px;font-weight:500;line-height:1;text-align:center;font-variant-numeric:tabular-nums}.shootoutScore{color:var(--fg);font-size:22px}
    .boards.multi .scoreTop{grid-template-columns:46px 46px 46px}.boards.multi .score{font-size:41px}.boards.multi .vs{font-size:20px}.boards.multi .status{top:calc(50% + 20px);width:138px;font-size:17px}.boards.multi .shootoutScore{font-size:19px}
    #statusDot{position:fixed;top:6px;left:6px;z-index:1000000;width:12px;height:12px;border-radius:50%;background:transparent;pointer-events:none}
    .debug{position:fixed;top:90px;left:24px;z-index:999999;display:none;min-width:190px;gap:10px;flex-direction:column;padding:10px;border:1px solid rgba(255,255,255,.22);border-radius:14px;background:rgba(0,0,0,.72);font:14px system-ui,sans-serif;text-transform:none;backdrop-filter:blur(6px)}
    .debugRow{display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
  </style>
</head>
<body data-mode="welcome">
  <div class="stage" id="stage">

    <main class="content"><section class="boards" id="boards" aria-label="Live football scores"></section></main>
  </div>

    const SCORE_CACHE_KEY="two-pennies-scores:last-success",REQUEST_TIMEOUT_MS=15000,MAX_RETRY_DELAY=10*60000;
    let pollTimer=null,pollInFlight=false,pollImmediately=false,failureCount=0,lastRenderedData=null,lastFetchedData=null,lastRenderSignature="",lastFeedEtag="";

    function annotateAndSort(matches,settings){const priority=new Map((settings.competitions||[]).map((id,index)=>[id,index]));return(matches||[]).filter(match=>match?.homeTeam&&match?.awayTeam).map(match=>{const kick=parseUtc(match.utcDate)||new Date(0),status=String(match.status||"").toUpperCase(),live=isLiveStatus(status),highlighted=isHighlighted(match,settings);return{...match,__kick:kick,__live:live,__highlighted:highlighted,__pin:highlighted}}).sort((a,b)=>{if(a.__pin!==b.__pin)return a.__pin?-1:1;if(a.__live!==b.__live)return a.__live?-1:1;const comp=(priority.get(a.comp)??999)-(priority.get(b.comp)??999);return comp||a.__kick-b.__kick})}

    function filterForDisplay(sorted,now,mode,settings){let display=sorted.filter(match=>{const status=String(match.status||"").toUpperCase();if(isLiveStatus(status))return true;if(["SCHEDULED","TIMED"].includes(status)){const minutes=(match.__kick-now)/60000;return minutes>=0&&minutes<=settings.preMinutes}if(status==="FINISHED")return finishedInWindow(match,now,settings);return false});if(mode==="live"&&!display.length)display=sorted.filter(match=>["SCHEDULED","TIMED"].includes(String(match.status||"").toUpperCase())).slice(0,settings.maxRows);return display}

    function appendRedCards(container,cards,side){if(!cards?.length)return;const list=document.createElement("span");list.className="incidentList";for(const card of cards){const item=document.createElement("span"),icon=document.createElement("span"),label=document.createElement("span");item.className="incidentItem";icon.className="redCardIcon";icon.setAttribute("aria-label","red card");label.textContent=side==="home"?`${card.time||""} ${card.name||""}`.trim():`${card.name||""} ${card.time||""}`.trim();if(side==="home")item.append(label,icon);else item.append(icon,label);list.appendChild(item)}container.appendChild(list)}

    function goalTimeLabel(goal){const marker=goal.ownGoal?" (OG)":goal.penalty?" (P)":"";return`${goal.time||""}${marker}`.trim()}

    function appendGoals(container,goals,side){if(!goals?.length)return;const list=document.createElement("span"),icon=document.createElement("span"),labels=document.createElement("span");list.className="incidentList";icon.className="goalIcon";icon.textContent="⚽";icon.setAttribute("aria-label","goals");labels.textContent=groupedScorers(goals,side).map(scorerGroupLabel).join(" · ");if(side==="home")list.append(labels,icon);else list.append(icon,labels);container.appendChild(list)}

    function rowElement(match){const score=scoresFor(match),shootout=shootoutScoreFor(match),showScore=!isPreKickoff(match),row=document.createElement("div");row.className=`row${match.__highlighted?" highlight":""}`;row.innerHTML='<div class="teamPanel home"><div class="incident redCards"></div><div class="team"></div><div class="incident scorers"></div></div><div class="scoreLine"><div class="scoreTop"><span class="score scoreHome"></span><span class="vs">vs</span><span class="score scoreAway"></span></div><div class="status"></div></div><div class="teamPanel away"><div class="incident redCards"></div><div class="team"></div><div class="incident scorers"></div></div>';const homePanel=row.querySelector(".teamPanel.home"),awayPanel=row.querySelector(".teamPanel.away"),incidents=match.incidents||{};homePanel.querySelector(".team").textContent=match.homeTeam?.name||"";awayPanel.querySelector(".team").textContent=match.awayTeam?.name||"";appendRedCards(homePanel.querySelector(".redCards"),incidents.home?.redCards,"home");appendRedCards(awayPanel.querySelector(".redCards"),incidents.away?.redCards,"away");appendGoals(homePanel.querySelector(".scorers"),incidents.home?.goals,"home");appendGoals(awayPanel.querySelector(".scorers"),incidents.away?.goals,"away");row.querySelector(".scoreHome").textContent=showScore?score.home??"":"";row.querySelector(".scoreAway").textContent=showScore?score.away??"":"";const status=row.querySelector(".status"),label=statusLabel(match);if(shootout){const homePens=document.createElement("span"),phase=document.createElement("span"),awayPens=document.createElement("span");homePens.className=awayPens.className="shootoutScore";homePens.textContent=shootout.home;phase.textContent=label;awayPens.textContent=shootout.away;status.append(homePens,phase,awayPens)}else status.textContent=label;return row}

      const pl=competition("pl","PL","Premier League","/assets/competitions/premier-league.png"),cup=competition("league-cup","LC","Carabao Cup","/assets/competitions/league-cup.png"),featured=match("sample-1","pl",pl,"Newcastle","Liverpool",2,1,Number(params.get("minute")||67));

    function partialFailure(data){return(data.health?.competitions||[]).some(item=>item?.error)}
    function usableCompetition(item){return!item?.error||item.usable===true}
    function mergeFailedCompetitions(data,previous){if(!previous)return data;const failed=new Set((data.health?.competitions||[]).filter(item=>!usableCompetition(item)).map(item=>item.competition));if(!failed.size)return data;return{...data,matches:[...data.matches.filter(match=>!failed.has(match.comp)),...previous.matches.filter(match=>failed.has(match.comp))]}}
    function saveFeed(data){try{localStorage.setItem(SCORE_CACHE_KEY,JSON.stringify({savedAt:new Date().toISOString(),data}))}catch(error){if(DEBUG)console.warn("Unable to save last scores",error)}}
    function restoreFeed(){try{const cached=JSON.parse(localStorage.getItem(SCORE_CACHE_KEY)||"null"),savedAt=new Date(cached?.savedAt||0);if(!Number.isFinite(savedAt.getTime())||!validFeed(cached?.data))return null;return cached.data}catch(error){if(DEBUG)console.warn("Unable to restore last scores",error);return null}}
    async function fetchFeed(){if(preview==="welcome")return{...sampleData(false),matches:[],forcedWelcome:true};if(preview==="one")return sampleData(false);if(preview==="two")return sampleData(true);const query=new URLSearchParams({view:"display"});for(const key of["comps","max","pre","post","source","highlight"])if(params.has(key))query.set(key,params.get(key));if(forcedMode==="live")query.set("mode","live");const controller=typeof AbortController==="function"?new AbortController:null;let rejectTimeout;const timedOut=new Promise((_,reject)=>rejectTimeout=()=>{controller?.abort();const error=new Error("Scores request timed out");error.name="TimeoutError";reject(error)}),timeout=setTimeout(rejectTimeout,REQUEST_TIMEOUT_MS);try{const headers=lastFeedEtag?{"if-none-match":lastFeedEtag}:{},request=fetch(`/api/scores?${query}`,{cache:"no-store",headers,...(controller?{signal:controller.signal}:{})}),result=await Promise.race([request,timedOut]);if(result.status===304&&lastFetchedData)return lastFetchedData;const data=await result.json().catch(()=>null);if(!result.ok||!validFeed(data))throw new Error(data?.error||`Scores request failed (${result.status})`);lastFeedEtag=result.headers.get("etag")||"";lastFetchedData=data;return data}finally{clearTimeout(timeout)}}
    function nextPollDelay(sorted,now){if(sorted.some(match=>match.__live))return 30000;let soonest=Infinity,overdue=false;for(const match of sorted){const status=String(match.status||"").toUpperCase();if(!["TIMED","SCHEDULED"].includes(status))continue;const untilKick=match.__kick-now;if(untilKick<0&&untilKick>=-4*60*60*1000)overdue=true;else if(untilKick>=0)soonest=Math.min(soonest,untilKick)}if(overdue)return 30000;if(soonest<=3*60*60*1000)return 60000;if(soonest<=24*60*60*1000)return 5*60000;return 10*60000}
    function displayFeed(data){const now=new Date,settings=data.settings,sorted=annotateAndSort(data.matches,settings),mode=data.forcedWelcome?"welcome":decideMode(sorted,now,settings),display=filterForDisplay(sorted,now,mode,settings),groups=groupMatches(display,settings),signature=JSON.stringify({mode,groups,maxRows:settings.maxRows,showCompetitionLogo:settings.showCompetitionLogo});setMode(mode);if(signature!==lastRenderSignature){renderBoards(groups,settings);lastRenderSignature=signature}if(DEBUG)dbgSource.textContent=settings.sourceMode;lastRenderedData=data;return{sorted,now}}
    function schedulePoll(delay){clearTimeout(pollTimer);if(DEBUG)dbgNextPoll.textContent=`${Math.round(delay/1000)}s`;pollTimer=setTimeout(tick,delay)}
    async function tick(){if(pollInFlight){pollImmediately=true;return}pollInFlight=true;try{setDot("warn");dbgErr.textContent="—";const started=new Date;if(DEBUG)dbgLastPoll.textContent=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(started);const data=await fetchFeed(),degraded=partialFailure(data),merged=degraded?mergeFailedCompetitions(data,lastRenderedData):data,{sorted,now}=displayFeed(merged);setDot(degraded?"warn":"good");if(DEBUG&&degraded)dbgErr.textContent="Partial feed failure; using last scores only where needed";if(!degraded)saveFeed(data);const hasUsable=(data.health?.competitions||[]).some(usableCompetition);failureCount=degraded&&!hasUsable?Math.min(failureCount+1,5):0;if(!preview)schedulePoll(degraded&&!hasUsable?Math.min(60000*2**(failureCount-1),MAX_RETRY_DELAY):nextPollDelay(sorted,now))}catch(error){failureCount=Math.min(failureCount+1,5);setDot("bad");if(DEBUG)dbgErr.textContent=error?.message||String(error);if(!lastRenderedData){setMode("welcome");renderBoards([],{maxRows:5})}if(!preview)schedulePoll(Math.min(60000*2**(failureCount-1),MAX_RETRY_DELAY))}finally{pollInFlight=false;if(pollImmediately&&!preview){pollImmediately=false;schedulePoll(0)}}}
    const restored=preview?null:restoreFeed();if(restored){displayFeed(restored);setDot("bad");if(DEBUG)dbgErr.textContent="Restored saved scores; reconnecting"}else setDot("clear");addEventListener("online",()=>{failureCount=0;if(pollInFlight)pollImmediately=true;else schedulePoll(0)});schedulePoll(200);
  </script>
